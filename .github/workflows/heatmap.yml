name: heatmap

on:
  schedule:
    - cron: "17 23 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config.toml", "generate.py", "heatmap/**", "fonts/**", ".github/workflows/heatmap.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.svg' '*.html'
          git diff --cached --quiet || git commit -m "heatmap: actualizar"
          git push
